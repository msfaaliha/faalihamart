# Render Blueprint Specification for FaalihaMart C++20 Marketplace
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: faalihamart
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: AI_CHAT_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info
