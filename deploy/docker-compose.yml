services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: faalihamart-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - app-data:/opt/faalihamart/data
      - app-logs:/opt/faalihamart/logs
    environment:
      - DATABASE_FILE=/opt/faalihamart/data/faalihamart.db
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: faalihamart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
  app-logs:
